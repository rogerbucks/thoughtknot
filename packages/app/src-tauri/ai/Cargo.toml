[package]
name = "tauri-plugin-ai"
version = "0.10.0"
description = "ThoughtKnot's AI on the iPhone and iPad: keys in the Keychain, requests the person sends, and Apple's on-device model."
license = "MPL-2.0"
edition = "2021"
publish = false
links = "tauri-plugin-ai"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
