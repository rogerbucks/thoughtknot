[package]
name = "thoughtknot-app"
version = "0.7.1"
description = "ThoughtKnot: draw, edit and keep graph notes in a plain folder, offline."
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "thoughtknot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }

# the folder dialog, on a computer only: a phone keeps its notes in the app's own folder (src/lib.rs, own_documents)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.1"
