[workspace]
# the store is tested on its own, with no window: cargo test -p thoughtknot-store
members = ["store"]

[package]
name = "thoughtknot-app"
version = "0.10.0"
description = "ThoughtKnot: draw, edit and keep graph notes in a plain folder, offline."
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "thoughtknot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
# the vault key in the phone's own secure store: this app's own plug-in, in keeper/
tauri-plugin-keeper = { version = "=0.10.0", path = "keeper" }
automerge = "0.12"
# the rows of notes read in parts, in a SQLite file on the device: this app's own crate, in store/
thoughtknot-store = { version = "=0.9.0", path = "store" }

# the gh calls' list is tested on the cases the core reads too (src/gh.rs)
[dev-dependencies]
serde_json = "1"

# the folder dialog, on a computer only: a phone keeps its notes in the app's own folder (src/lib.rs, own_documents)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.1"
