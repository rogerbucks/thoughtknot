// graph: project_ethos · SOURCE
// What ThoughtKnot stands for, and the rules that follow from it. Each rule names the requirements that check it, or
// says a person checks it, or that nothing checks it yet. scripts/ethos.mjs reads it; the wiki's Ethos page is made from it.
// ── Principles ──
(everyone:Principle {order: 1, name: 'Everyone can use it', why: 'Graph notes are for every reader, whatever their sight, hands or way of reading.'}),
(every_language:Principle {order: 2, name: 'It speaks your language and fits your culture', why: 'A reader should never have to read in a language, a direction or a format that is not their own.'}),
(plain_words:Principle {order: 3, name: 'Plain words', why: 'If a reader has to stop and decode a message, the message has failed. Every word is written so a reader with ADHD can scan it: in the app, in the documents and in the code. Plain words hold in every language, so a translation is plain in its own language, never English mixed in.'}),
(private:Principle {order: 4, name: 'Your notes stay yours', why: 'Notes hold private thoughts. Nothing leaves the device unless the person sends it.'}),
(person_decides:Principle {order: 5, name: 'The person decides', why: 'An AI may suggest, but only the person changes their graph.'}),
(checked:Principle {order: 6, name: 'Checked, not promised', why: 'A rule nobody checks is a wish. Each rule here says how it is checked, so anyone can see it holds.'}),
(open:Principle {order: 7, name: 'Open to join, closed to rip-offs', why: 'Anyone may fork it, change it and send their work back, and the name stays with the original.'}),
(oriented:Principle {order: 8, name: 'Never disorient the user', why: 'A reader who loses their place loses their thought. Whatever the view or the projection, the person always knows where they are, what moved and how to go back.'}),
(fit_the_place:Principle {order: 9, name: 'Change the setting, not the person', why: 'The same person can do their best or their worst work depending on the setting around them. So ThoughtKnot bends to the person, and never asks who they are or why.'}),
(guard_attention:Principle {order: 10, name: 'Guard attention, never harvest it', why: 'Attention follows interest, so an endlessly new tool can eat the hour meant for the task. ThoughtKnot helps with the task, then gets out of the way.'}),
(lands_home:Principle {order: 11, name: 'Work lands where it lives', why: 'A plan left in a chat is a plan nobody opens again. What the person or an AI works out lands in a note or a graph, where it is found again.'}),
(honest:Principle {order: 12, name: 'Honest, not agreeable', why: 'A tool that always agrees can feed a grand plan, a wrong guess or a worry loop. AI in ThoughtKnot says how sure it is and gives the other side.'}),
// ── Rules ──
(r_wcag:Rule {text: 'Every view of every host meets WCAG 2.2 AA in the light and the dark theme.', requirements: 'wcag_aa wcag_new_hosts contrast_both_themes'}),
(r_keyboard:Rule {text: 'Everything can be done with the keyboard alone.', requirements: 'keyboard_reach keyboard_any_device a11y_keyboard_auto'}),
(r_screen_reader:Rule {text: 'Every control has a name and says its state, and every drawing has a text version.', requirements: 'a11y_semantics_auto screen_reader_text'}),
(r_sight:Rule {text: 'Motion stops when asked, colour never carries meaning alone, and text can grow to twice its size.', requirements: 'motion_reduced_respected colour_never_alone forced_colours text_scaling'}),
(r_catalogue:Rule {text: 'Every word the reader sees comes from one catalogue, so it can be translated, and follows the host\'s language.', requirements: 'words_catalogue translations_as_files language_follows_host'}),
(r_formats:Rule {text: 'Numbers, dates, times and lists are written and sorted the reader\'s way.', requirements: 'locale_formats locale_sorting'}),
(r_direction:Rule {text: 'Right-to-left languages read right to left, checked in test languages on every view.', requirements: 'rtl_mirrors bidi_labels rtl_drawing_direction pseudo_locales_checked'}),
(r_same_bytes:Rule {text: 'A language or culture setting never changes a byte of what is saved.', requirements: 'locale_never_changes_bytes'}),
(r_culture_neutral:Rule {text: 'Words and pictures avoid idioms, jokes, gestures and symbols that only make sense in one culture.', check: 'not yet', how: 'Nothing checks this yet: a word list like the plain-language jargon list is the next step.'}),
(r_plain:Rule {text: 'What the user reads keeps to a reading grade of 9, sentences of 25 words or fewer, and no jargon.', requirements: 'ux_copy_auto'}),
(r_plain_docs:Rule {text: 'Every document and code comment, in whatever language it is written, uses plain language: short sentences, short paragraphs, headings to scan by and no filler words. A file never gets worse, and a new file starts clean.', requirements: 'plain_docs_auto'}),
(r_uk_spelling:Rule {text: 'UK spelling in code, comments, messages and the interface.', check: 'person', how: 'Reviewed in each pull request (CONTRIBUTING.md).'}),
(r_offline:Rule {text: 'No network request of its own: no analytics, no update checks, no remote images.', requirements: 'offline_and_mobile_apis'}),
(r_ai_consent:Rule {text: 'AI is off until the person turns it on, they see what will be sent before it goes, and nothing goes in the background or above a note\'s classification.', requirements: 'ai_off_until_chosen seen_before_sent never_in_background never_above_ceiling never_credential'}),
(r_proposals:Rule {text: 'An AI\'s answer is a proposal, accepted or rejected by the person one change at a time.', requirements: 'answers_are_proposals person_decides proposal_one_by_one'}),
(r_ai_disclosed:Rule {text: 'Where an AI helped, it says so.', requirements: 'ai_disclosed'}),
(r_tests_first:Rule {text: 'Spec, then test, then code: each test is seen failing before its code is written.', requirements: 'tests_first done_means_proved'}),
(r_ratchet:Rule {text: 'The quality figures only get better: a release that does worse fails unless the reason is written down.', requirements: 'quality_ratchet'}),
(r_rules_checked:Rule {text: 'Every rule on this page names its check, or says plainly that it has none yet.', requirements: 'ethos_checked'}),
(r_licence:Rule {text: 'The licence (MPL-2.0) lets anyone use, fork and change the code and send a pull request, and keeps changed files open.', requirements: 'mpl_licence'}),
(r_name:Rule {text: 'The name ThoughtKnot marks the original. A fork goes by its own name (TRADEMARKS.md).', requirements: 'community_files'}),
(r_conduct:Rule {text: 'Everyone who takes part is treated with respect, and a problem can be reported in private (CODE_OF_CONDUCT.md).', requirements: 'community_files'}),
(r_security:Rule {text: 'A security problem is reported in private and fixed before it is made public (SECURITY.md).', requirements: 'security_policy'}),
(r_signed_off:Rule {text: 'Every commit in a pull request is signed off, saying its author may send it under the licence.', check: 'person', how: 'A box on the pull request template; an automatic check on each commit is the next step.'}),
(r_keep_place:Rule {text: 'The person\'s place, focus, selection and zoom are kept across a change of layout, a filter, opening or folding a group, and a switch between 2D, 2.5D and 3D.', requirements: 'view_switch_view_only cluster_in_place scale_filter_live'}),
(r_glide:Rule {text: 'Things glide from where they were to where they go, aligned first so the drawing does not spin or jump. Reduced motion shows the end at once, and a move by the person stops the glide.', requirements: 'space_glide layout_glide motion_reduced_respected'}),
(r_unasked:Rule {text: 'Nothing moves or recentres unless the person asked: a pinned thing stays put, a layout runs again only when asked, and the first click only selects.', requirements: 'view_presets_predictable layout_checks_gated sketch_click_rule'}),
(r_way_back:Rule {text: 'Every change of view has a way back: a group folds back where it opened, and a preset can be undone in one step.', requirements: 'cluster_fold_back view_presets_predictable'}),
(r_cues:Rule {text: 'Orientation cues stay: the minimap shows the whole drawing and where the view is, and the thing in focus is always marked.', requirements: 'orientation_cues mini_map mini_map_shape space_mini_map'}),
(r_every_view:Rule {text: 'These rules hold for every user interaction in every view and projection (2D, 2.5D, 3D), tuned to each, never in one view only.', check: 'person', how: 'Reviewed in each pull request that touches a view or an interaction (CONTRIBUTING.md).'}),
(r_routines:Rule {text: 'An update never changes a person\'s saved views, presets or shortcuts without saying so first, so routines built on the app survive.', check: 'not yet', how: 'Nothing checks this yet: a test that loads last release\'s settings into this one is the next step.'}),
(r_no_inference:Rule {text: 'ThoughtKnot never guesses a condition from how a person uses it, writes or draws, and never sends such a signal anywhere.', check: 'not yet', how: 'Nothing checks this yet: a review line in the pull request template is the next step.'}),
(r_own_voice:Rule {text: 'An AI edit is the smallest change that does the job; it rewrites only when asked, so the person\'s own voice stays.', check: 'not yet', how: 'Proposals come one change at a time (proposal_one_by_one); a cap on how much one proposal may rewrite is the next step.'}),
(r_by_need:Rule {text: 'Settings are named by what they do for the reader, never by a diagnosis.', requirements: 'view_presets_by_need'}),
(r_hard_day:Rule {text: 'A lighter view is one step away on a hard day, and a person\'s own setups are kept for each place they work.', requirements: 'controls_zen view_presets_scoped'}),
(r_mix:Rule {text: 'Supports mix: a person can take parts of two presets, such as calm motion with focus support, as needs rarely come one at a time.', check: 'not yet', how: 'Presets are picked one at a time today; mixing parts of two is the next step.'}),
(r_no_hooks:Rule {text: 'No streaks, badges, endless feeds, nags or pings meant to bring a person back.', check: 'not yet', how: 'Nothing checks this yet: a word list in the copy check (ux_copy_auto) is the next step.'}),
(r_time_box:Rule {text: 'A person can set a time box for AI sessions and quiet hours, after which AI waits until the next day.', check: 'not yet', how: 'Nothing checks this yet: it needs a requirement and a setting first.'}),
(r_lands:Rule {text: 'An AI answer worth keeping becomes a change to a note or a graph that the person accepts; nothing useful lives only in a chat panel.', requirements: 'answers_are_proposals'}),
(r_where_was_i:Rule {text: 'After a break, the app shows where the person was and what changed since.', check: 'not yet', how: 'The focus trail (view_focus_support) covers part; a "since you left" view is the next step.'}),
(r_how_sure:Rule {text: 'Every AI suggestion says in words how sure it is and what it rests on.', check: 'not yet', how: 'Claims in a graph carry their certainty (certainty_in_words); AI suggestions do not yet.'}),
(r_other_side:Rule {text: 'Asked to judge an idea, AI gives the case against as well as the case for, as links the person can keep or drop.', check: 'not yet', how: 'Supports and contradicts links exist (Wave 18); asking the AI for both sides is the next step.'}),
(r_guess_not_verdict:Rule {text: 'An AI reading of tone or intent is shown as a guess to check, never as a verdict.', check: 'not yet', how: 'Nothing checks this yet: a fixed label on such answers is the next step.'}),
