name: Phone and tablet app

# The phone and tablet app (spec §40, android_app and ios_app): the desktop app's Tauri shell, built for Android and for
# the iPhone and iPad simulator, so a phone build is never first tried by a person (mobile_checked).
# - Android: a debug APK for 64-bit ARM phones and tablets, kept as a download of the run. It is signed with the
#   build's own throwaway debug key, as every Android debug build is. No key of Roger's is used or needed.
# - iPhone and iPad: built for the simulator only, with signing switched off. A build for a real device needs Roger's
#   Apple account, which waits for Apple to fix his developer name (docs/app-signing.md). No Apple key is used here.
# Tauri writes the Android Studio and Xcode projects (src-tauri/gen/, never committed) at the start of each run.
on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - '.github/workflows/mobile-app.yml'
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/claude-code/page/**'
      - 'packages/claude-code/esbuild.page.mjs'
      - 'packages/core/src/**'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:
  # the nightly. It builds the commit the nightly woke at: a ref handed in here would be a checkout CodeQL cannot
  # trust (cache-poisoning), as this workflow holds no key that makes it privileged
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mobile-app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build --workspace packages/app
      # the runner carries the Android SDK, its NDK and Java 17; Rust needs only the phone's target
      - run: rustup target add aarch64-linux-android
      # built fresh each run: a cache restored here could be poisoned by an earlier run (CodeQL, cache-poisoning)
      - run: cargo install tauri-cli --locked --version 2.12.4
      # the runner's own Java 17 and newest NDK, named as Tauri reads them
      - working-directory: packages/app/src-tauri
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          cargo tauri icon icons/icon.png
          cargo tauri android build --ci --debug --apk --target aarch64
      # The keeper's tests (keeper/android/src/androidTest) on an Android emulator: the vault key is made at first launch,
      # kept sealed by a key in the Android Keystore, and never written out. KVM lets the emulator run at speed.
      - name: The vault key on an Android emulator
        timeout-minutes: 25
        working-directory: packages/app/src-tauri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export JAVA_HOME="$JAVA_HOME_17_X64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-34;google_apis;x86_64'
          yes | "$tools/sdkmanager" --install emulator "$image" > /dev/null
          echo no | "$tools/avdmanager" create avd --force --name keeper --package "$image"
          "$ANDROID_HOME/emulator/emulator" -avd keeper -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
          cd gen/android && ./gradlew --no-daemon :tauri-plugin-keeper:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoughtknot-app-android
          if-no-files-found: error
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build --workspace packages/app
      - run: rustup target add aarch64-apple-ios-sim
      # built fresh each run: a cache restored here could be poisoned by an earlier run (CodeQL, cache-poisoning)
      - run: cargo install tauri-cli --locked --version 2.12.4
      # built for the simulator with signing skipped: no Apple account, team or key is asked for
      - working-directory: packages/app/src-tauri
        run: |
          cargo tauri ios init --ci
          cargo tauri icon icons/icon.png
          cargo tauri ios build --ci --debug --target aarch64-sim --no-sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoughtknot-app-ios-simulator
          if-no-files-found: error
          path: packages/app/src-tauri/gen/apple/build/arm64-sim/*.app
