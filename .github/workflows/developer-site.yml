name: Developer site

# Makes the developer site from the repository (ES§41, developer_site): the graph libraries, the graph format spec
# and the nightly builds. It runs on every push to main and each morning, so it names the newest stable release and
# lists the newest nightlies. It only builds and keeps the folder as a short-lived download. It does not publish it:
# GitHub Pages allows one custom domain a repository, and thoughtknot.app already has this one, so thoughtknot.dev
# needs a host of its own, which the owner chooses. Until then thoughtknot.dev stays a temporary (302) redirect.
# The job only reads, and nothing of a pull request ever runs here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-site
  cancel-in-progress: true

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - name: List the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt,isPrerelease > "$RUNNER_TEMP/releases.json"
      - name: Write the site
        run: node scripts/developer-site.mjs --out developer-site-out --sha "$GITHUB_SHA" --releases "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: developer-site-out
          retention-days: 3

  # A failure here tells nobody otherwise (OPS-6): this keeps one open issue, labelled workflow-failure.
  report-failure:
    needs: [make]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/report-failure.yml
