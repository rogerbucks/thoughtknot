name: Other systems

# The tests on macOS and Windows, which the pull request and main runs leave out: they run on Linux only. This catches a
# path, line-ending or file-name slip before a person on a Mac or a Windows PC finds it (Roger, 25 Oct 2026). It runs
# once a night, an hour after the nightly, and by hand. It never runs on a pull request, so it adds nothing to a merge.
# It is a report: the nightly does not wait on it, and a red run is the news. The runners are free here, as the
# repository is public (releases-and-ci-budget).
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-check
  cancel-in-progress: false

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the record of tests seen failing first is checked against the history it was made from
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - env:
          THOUGHTKNOT_TEST_MEMORY_MB: 8192
          # the parity tests read what Python prints as UTF-8, as the python job below does
          PYTHONUTF8: '1'
        run: npm test -- --test-concurrency=4 --test-reporter=./scripts/quiet-reporter.mjs --test-reporter-destination=stdout --test-reporter=spec --test-reporter-destination=test-report.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ runner.os }}
          path: test-report.txt
          retention-days: 7

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Python reads what Node writes as UTF-8 here, as it does on Linux and macOS. Windows would read it in its own code
    # page, and turn each · and — into another letter. Python 3.15 makes this the default (PEP 686).
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
        working-directory: python/graph_spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the parity tests read the shared cases through Node, as in ci.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.17
          enable-cache: false
      # a plain install, as the python-no-engine job: the engine is Linux's own check
      - run: uv sync --locked --no-default-groups
      - run: node ../../scripts/run-ceiling.mjs uv run --locked --no-default-groups python -m unittest discover -s tests
