name: Nightly

# A nightly build from main, published as a GitHub pre-release (spec §41, nightly_prerelease), for those who want the
# newest work; everyone else stays on the stable releases release.yml makes from a bare version tag. It runs at 16:00 UTC
# (2 am in Brisbane), and by hand. A night on which main has not moved since the last nightly publishes nothing.
#
# Seven jobs, so no code runs beside the write. `check` asks GitHub, read only, whether main moved since the last
# nightly. `security` stops the night on an open high or critical security alert. `build` checks out main, installs and runs main's own code with read access only: the content check and the build.
# `tests-passed` does not run the suite again: it asks GitHub whether main's own CI passed it on this
# commit, and `publish` waits for that, so a nightly is published only when every test passed. `build` uploads the same assets a release
# carries, with the nightly version (scripts/nightly-version.mjs) in their manifest. `desktop` builds the desktop app's
# installers at the same commit, by the Desktop app workflow: a .dmg, an NSIS .exe and a .deb. Each is signed where
# its keys are set, and unsigned where they are not (Roger, 23 Oct 2026: private nightlies only, unsigned if there is
# no signature). A night the installers fail still publishes the plugin, without them. `publish` may write the
# repository's contents, which a release needs, and so runs no code of the repository at all: no checkout, no install,
# no Node. It creates the pre-release with gh alone, and keeps the last seven nightlies. A pre-release never counts as a
# release: the build status and the wiki are woken only by a stable one (types: [released]) and leave pre-releases out.
# `drafts` runs every night, moved or not, and fails while a stable release has waited as a draft for over a day, so its
# owner hears of it (risk OPS-3; RELEASING.md, "Cutting a release").
#
# A wave's end also builds one (Roger, 23 Oct 2026), through wave-nightly.yml, which calls this file. That run always
# builds, as one by hand does. A second build on the same day takes the next letter, as the version script says.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  # Called by wave-nightly.yml when a pull request labelled wave-done merges, so a wave can be tested the day it ends.
  workflow_call:
    inputs:
      wave:
        description: True when a wave's end made this run, which leaves the draft check to the night
        type: boolean
        default: false

permissions:
  contents: read

# One nightly at a time, none cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      moved: ${{ steps.moved.outputs.moved }}
      sha: ${{ steps.moved.outputs.sha }}
    steps:
      - name: Has main moved since the last nightly?
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))][0].tagName // ""')
          built=""
          if [ -n "$last" ]; then built=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish); fi
          if [ "$built" = "$sha" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Main is still at $sha, built as $last: nothing to publish."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

  # No open high or critical security alert (spec §50, security_release_gate), read with a token that may see them. A
  # medium or low one is a warning here, for a stable release stops on every alert. It installs nothing, and only reads.
  security:
    needs: check
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No high or critical security alert is open, unless the risk register accepts it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: node scripts/security-alerts.mjs --nightly

  # A stranger's fresh clone sets up from the README's steps (spec §13). CI runs this only when a setup input changed;
  # the nightly runs it whole each night main has moved, as the release does, so a broken step is found within a day.
  public-readiness:
    needs: check
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THOUGHTKNOT_TEST_MEMORY_MB: 6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.17
          enable-cache: false
      # not the README's `npm test` line: main's CI ran the suite on this commit (tests-passed), and not again here
      - run: node scripts/public-readiness.mjs --history --setup --no-tests

  # The tests are not run a second time (Roger, 25 Oct 2026). Main's own CI ran the whole suite on this commit when it
  # merged (a push to main is never cancelled: ci.yml), so the nightly asks GitHub whether that run's `test` check
  # passed, and waits for it if it is still going. It reads only, with gh alone: no checkout, no install.
  tests-passed:
    needs: check
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: The CI run of this commit on main passed the whole suite
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$SHA is not a commit"; exit 1; }
          for attempt in $(seq 1 60); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$SHA" --json databaseId --jq '.[0].databaseId // empty')
            state=""
            if [ -n "$id" ]; then
              state=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "test")][0] | if . == null then "" else .status + " " + (.conclusion // "") end')
            fi
            echo "Try $attempt: CI run ${id:-none}, test check: ${state:-not started}"
            case "$state" in
              "completed success") echo "The suite passed on $SHA in main's CI, so it is not run again."; exit 0 ;;
              "completed "*) echo "::error::The suite did not pass on $SHA in main's CI ($state). See run $id."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Main's CI had not finished the suite on $SHA after 30 minutes."
          exit 1

  build:
    needs: [check, security]
    if: needs.check.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Main has not moved since `check` named the commit whose tests passed
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::main moved from $SHA while this ran; run the nightly again"; exit 1; }'
      - run: npm ci
      - run: npm audit signatures
      - run: node scripts/check-classification.mjs --all
      # the suite is not run here: main's CI ran it on this commit (tests-passed); publish waits for that
      - run: npm run build
      - name: The nightly version, written into the manifest the build carries
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        # a second build the same day takes the next letter, so it never replaces the first (scripts/nightly-version.mjs)
        run: |
          taken=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(test("-nightly\\."))] | join(" ")')
          echo "version=$(node scripts/nightly-version.mjs --date "$(date -u +%Y%m%d)" --taken "$taken" --write)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bundle the core's layout source into one file, for the vault's layout parity check
        run: npm run build:layout
      - name: Archive the graph-spec libraries from the built commit, for the vault to vendor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=tar.gz -o "graph-spec-libraries-$VERSION.tar.gz" --prefix=packages/graph-spec/src/ --add-file=packages/graph-spec/dist/graph-spec-check.js --prefix=packages/core/dist/ --add-file=packages/core/dist/layout-source-node.cjs --prefix= HEAD LICENSE THIRD_PARTY_NOTICES.md packages/graph-spec/package.json packages/graph-spec/src ':(exclude)packages/graph-spec/src/graph-spec-check.js' packages/graph-spec/bin python/graph_spec/pyproject.toml python/graph_spec/uv.lock python/graph_spec/src
      # The JavaScript library as two packages, at the nightly version the manifest now carries; never to npm (Q-02)
      - name: Build the library's packages, the reader, checker and layout, and the core
        run: node scripts/library-release.mjs --out .
      # The VS Code extension as one file to install, at the nightly version; never to the Marketplace
      - name: Build the VS Code extension as a .vsix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/vscode-release.mjs --version "$VERSION" --out .
      - name: Checksums for every asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$VERSION.tar.gz" "thoughtknot-graph-spec-$VERSION.tgz" "thoughtknot-core-$VERSION.tgz" "thoughtknot-vscode-$VERSION.vsix" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: |
            main.js
            manifest.json
            styles.css
            THIRD_PARTY_NOTICES.md
            graph-spec-libraries-*.tar.gz
            thoughtknot-*.tgz
            thoughtknot-vscode-*.vsix
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # The installers, by the Desktop app workflow at the built commit, read only. The time limit is that workflow's own.
  # They build beside the tests, not after them (they took 18 of the night's 31 minutes, in a row with the tests'
  # 13): `publish` still waits for the tests, so nothing goes out on a red suite. They build the commit `check` named;
  # if main moved before `build` checked it out, they are of another commit and `publish` leaves them out.
  desktop:
    needs: [check, security]
    if: needs.check.outputs.moved == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-app.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}

  publish:
    needs: [check, build, tests-passed, desktop]
    # the plugin is published when it built and every test passed, with the installers when they built too
    if: ${{ !cancelled() && needs.build.result == 'success' && needs['tests-passed'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly
          path: nightly
      - if: needs.desktop.result == 'success' && needs.check.outputs.sha == needs.build.outputs.sha
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: thoughtknot-app-*
          path: app
      - name: Name each installer by the nightly, and add it to the checksums
        if: needs.desktop.result == 'success' && needs.check.outputs.sha == needs.build.outputs.sha
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # ThoughtKnot_0.7.1_aarch64.dmg becomes thoughtknot-app-0.7.2-nightly.20261023-aarch64.dmg
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[b-z])?$ ]] || { echo "::error::$VERSION is not a nightly version"; exit 1; }
          # each artifact may keep its bundle folder (dmg/, nsis/, deb/), so every file is found at any depth
          find app -type f -print0 | while IFS= read -r -d '' f; do
            rest="$(basename "$f")"; rest="${rest#*_}"; rest="${rest#*_}"
            mv "$f" "nightly/thoughtknot-app-$VERSION-$rest"
          done
          (cd nightly && sha256sum thoughtknot-app-* >> SHA256SUMS)
      - name: Publish the pre-release, and keep the last seven nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[b-z])?$ ]] || { echo "::error::$VERSION is not a nightly version"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$SHA is not a commit"; exit 1; }
          cd nightly
          shopt -s nullglob
          installers=(thoughtknot-app-*)
          app=""
          if (( ${#installers[@]} )); then app=" The desktop app's installers (thoughtknot-app-*) are signed only where signing keys are set, so the system may warn before it opens one."; fi
          gh release create "$VERSION" main.js manifest.json styles.css THIRD_PARTY_NOTICES.md "graph-spec-libraries-$VERSION.tar.gz" "thoughtknot-graph-spec-$VERSION.tgz" "thoughtknot-core-$VERSION.tgz" "thoughtknot-vscode-$VERSION.vsix" "${installers[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" --title "Nightly $VERSION" --notes "A nightly build of main at $SHA. Every test passed on it, but it has not been through a stable release's checks. To try the VS Code extension, download thoughtknot-vscode-$VERSION.vsix and run Extensions: Install from VSIX... in VS Code. For the newest work only; most people should use the latest stable release.$app"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done

  # GitHub lists draft releases only to a token that may write contents, so this job has that and nothing else. Like
  # publish, it runs no code of the repository: no checkout, no install, no Node, only gh.
  drafts:
    # the nightly's own check; a wave-end build leaves it to the night
    if: ${{ !inputs.wave }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: No stable release has waited as a draft for more than a day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt --jq '[.[] | select(.isDraft and (.createdAt | fromdateiso8601) < now - 86400) | .tagName] | join(" ")')
          if [ -n "$waiting" ]; then
            echo "::error::A draft release has waited more than a day: $waiting. Publish it, or delete it, as RELEASING.md says."
            exit 1
          fi
