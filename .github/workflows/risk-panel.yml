name: Risk panel

# An expert panel reads what changed since the last stable release and proposes risks for quality/risks.json (spec
# §50, risk_panel). It is advice: it opens or updates one issue labelled risk-panel, and nothing else. The owner decides
# each risk (fix now, fix later, accept) in a pull request that edits the register. The release itself waits on the
# register alone, through scripts/risk-register.mjs --release, never on this workflow.
#
# It costs a Claude session only when there is something to look at. `scope` runs the repository's own script, with
# no install, to list the risks whose code moved and the roles whose areas changed since the last stable tag. When
# nothing changed, the run ends there. `panel` gives Claude that list alone, as the roles named, and keeps the token
# in that one step. `report` writes the issue with gh alone and runs no code of the repository.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Look at changes since this tag or commit (empty means the last stable tag)
        type: string
        default: ''
      all_roles:
        description: Every role looks, not only those whose areas changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: risk-panel
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the full history: the register names the commit each risk was last reviewed at
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Which risks went stale, and which roles' areas moved, since the last stable release
        id: scope
        env:
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then node scripts/risk-register.mjs --stale --json --since "$SINCE" > scope.json
          else node scripts/risk-register.mjs --stale --json > scope.json; fi
          if [ "$(node -p "const s=require('./scope.json'); s.stale.length + Object.keys(s.roles).length")" = "0" ]; then
            echo "Nothing the panel watches has changed: no session this time."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  panel:
    needs: scope
    if: needs.scope.outputs.changed == 'true' || inputs.all_roles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One session for each role, one after another. A single session for all nine stopped itself after the first
    # (7 Nov 2026: 45 turns, 100 seconds, "success", only Morgan's part written).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {
              n: 1,
              who: Morgan,
              role: 'senior security engineer (also privacy)',
              extra: 'the risks of roles "Trust model review" and "Code scanning (CodeQL)"',
            }
          - { n: 2, who: Dot, role: 'IT administrator and release engineer', extra: 'no others' }
          - { n: 3, who: Bram, role: 'senior coder and QA', extra: 'no others' }
          - { n: 4, who: Wren, role: 'enterprise, solution and data architect', extra: 'no others' }
          - { n: 5, who: Pip, role: 'user experience and accessibility lead', extra: 'no others' }
          - {
              n: 6,
              who: Juno,
              role: 'senior user interface designer for neurodiversity and data management',
              extra: 'no others',
            }
          - { n: 7, who: Tam, role: 'workflow designer and open-source maintainer', extra: 'no others' }
          - { n: 8, who: Rory, role: 'API design expert', extra: 'no others' }
          - { n: 9, who: Nell, role: 'AI product expert', extra: 'no others' }
    steps:
      - name: Check the token is set
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so no panel this time"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: steps.token.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The scope goes to a file, as a pipe cut it at 64 KB; and the folder exists, as the session could not make it.
      - if: steps.token.outputs.set == 'true'
        run: |
          mkdir -p panel-out panel-in
          if [ -n "$SINCE" ]; then node scripts/risk-register.mjs --stale --json --since "$SINCE" > panel-in/scope.json
          else node scripts/risk-register.mjs --stale --json > panel-in/scope.json; fi
        env:
          SINCE: ${{ inputs.since }}
      - if: steps.token.outputs.set == 'true'
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are an expert review panel for this repository, in interrogation mode. Read AGENTS.md first and obey
            its "Files never to read". Read RELEASING.md, section "Known risks", for how the register works.

            SCOPE: read panel-in/scope.json with the Read tool. It is not pasted here, as the whole register passed the
            limit on one command line (30 Oct 2026). Use Read, Grep and Glob, and single git or register commands
            with no pipes or redirects, as piped and compound commands are refused.
            EVERY ROLE: ${{ inputs.all_roles }}

            You are one reviewer of a panel of nine, and the only one in this session: ${{ matrix.who }}, the ${{ matrix.role }}.
            The other eight run in their own sessions. Do their work for none of them. If EVERY ROLE is false and the
            scope's "roles" names nothing for you, write nothing and stop.

            For each stale risk in the scope whose role matches yours (plus ${{ matrix.extra }}): read the files that
            moved and say whether the risk is now fixed, worse, or the same, with path:line proof. Then read the diff
            since the scope's "since" ref (git diff --stat and the files it names) and interrogate it with your role's
            hardest questions. Praise is not a finding. Do not report style a linter checks or what quality/risks.json
            already holds. Read a requirement's proved status from `node scripts/check-requirements.mjs --done N`,
            never by counting tests.

            You are a character in docs/agents/ROLES.md, section "The review panel’s characters". Open your part with
            a few dry, kind words in that character's voice (humour setting 60%: often none), signed with your name
            (${{ matrix.who }}). The risks table and the JSON stay plain: no jokes there.

            Work in the foreground, on your own: start no subagents and no background tasks. Rewrite your file as
            you go, so a run that is cut short still leaves a report. Do not stop until both parts are written: your
            proposed new risks, and one verdict line for each stale risk of yours.

            Write your findings to panel-out/${{ matrix.n }}-${{ matrix.who }}.md as plain language (sentences of 25
            words or fewer): first your part's heading ("## ${{ matrix.who }}: your role"), a table of proposed new
            risks, each as the JSON object quality/risks.json uses (id, role, area, title, risk, evidence,
            likelihood, impact, decision, fix, check, paths, effort), then one line per stale risk with your verdict. Propose a decision, but say the owner decides. Change nothing else, and push nothing.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Write(panel-out/*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(node scripts/risk-register.mjs:*)"
      # always(): a run that is cut short or fails still leaves what the panel wrote so far
      - if: always() && steps.token.outputs.set == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk-panel-${{ matrix.n }}
          path: panel-out
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: panel
    if: always() && needs.panel.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: risk-panel-*
          merge-multiple: true
          path: panel-out
      - name: Keep the risk-panel issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # one file for each role, in order; a role that wrote nothing is named, so a half-run never looks whole
          {
            printf '# Risk panel report\n\nEach role ran in its own session. The owner decides every decision below.\n\n'
            for n in 1 2 3 4 5 6 7 8 9; do
              f=$(ls panel-out/"$n"-*.md 2>/dev/null | head -n 1)
              if [ -n "$f" ]; then cat "$f"; printf '\n\n'; else printf '## Role %s: nothing written (cut short or nothing in scope)\n\n' "$n"; fi
            done
          } > panel-out/panel.md
          ls panel-out/*-*.md >/dev/null 2>&1 || : > panel-out/panel.md
          body=panel-out/panel.md
          # GitHub caps an issue body at 65,536 characters: keep the head and point to the run for the rest
          if [ -s "$body" ] && [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > panel-out/short.md
            printf '\n\n(Cut to fit an issue. The whole report is in the risk-panel artifact of this run: %s)\n' "$RUN_URL" >> panel-out/short.md
            body=panel-out/short.md
          fi
          number=$(gh issue list --label risk-panel --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ ! -s "$body" ]; then
            [ -n "$number" ] && gh issue close "$number" --comment "The panel found nothing new to add."
            exit 0
          fi
          gh label create risk-panel --description "What the expert panel proposes for quality/risks.json" --color d93f0b 2>/dev/null || true
          if [ -z "$number" ]; then
            gh issue create --title "Risk panel: proposed risks since the last release" --label risk-panel --body-file "$body"
          elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat "$body")" ]; then
            gh issue edit "$number" --body-file "$body"
            gh issue comment "$number" --body-file "$body"
          fi
