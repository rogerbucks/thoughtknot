# Version updates wait seven days after publication and arrive grouped, once a
# week. Security updates are not grouped and have no cooldown: they are raised
# as soon as an advisory is published, and run the full CI suite as a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Held back: the Obsidian review rules (eslint-plugin-obsidianmd 0.4.2)
    # need ESLint 9, @eslint/json 0.14 and a TypeScript that typescript-eslint
    # supports (below 6.1). A new major of any of these fails npm ci. Lift each
    # hold when the Obsidian linter supports it. Minor and patch updates, and
    # security fixes, still come through.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/json' # pinned exactly by the Obsidian linter: every version is held
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: uv
    directory: /python/graph_spec
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Held back: Grafeo 0.5.43 is the GQL dialect the graph spec names and the reference the Python reader is proved
    # against (python/graph_spec/pyproject.toml). 0.6.0 is a breaking release: numbers with a point come back as exact
    # decimals, a path returns its nodes and links in full, and an INSERT that binds a variable twice is refused. So a
    # new version of Grafeo comes in the change that moves the dialect to it (30 Oct 2026: #1555 bumped it and sat red
    # for three days; the move is issue #1747). Patches are held too: 0.5.44 already brings the breaks of 0.6 (#1808).
    # Security fixes still come through, as update-types holds back version updates only.
    ignore:
      - dependency-name: grafeo
        update-types: ['version-update:semver-patch', 'version-update:semver-minor', 'version-update:semver-major']
    groups:
      uv-version-updates:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Held back: the benchmark image runs the Node that CI runs (node-version in ci.yml), so counts made in it
    # compare with CI's. A new major of Node comes here in the change that moves CI to it (30 Oct 2026: #1554
    # bumped the image to Node 26 while CI ran 24, and sat red).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns: ['*']
